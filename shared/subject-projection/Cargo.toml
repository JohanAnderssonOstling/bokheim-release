[package]
name = "subject-projection"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[features]
default = ["authoritative-taxonomy"]
authoritative-taxonomy = []

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
bincode = { version = "2", features = ["serde"] }
book-model = { path = "../book-model" }
csv = "1.3.1"
rusqlite = { version = "0.40.0", features = ["backup", "bundled", "serialize"] }
uuid = { version = "1", features = ["v5"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js", "v5"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
bincode = { version = "2", features = ["serde"] }
csv = "1.3.1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
uuid = { version = "1", features = ["v5"] }
