[package]
name = "pdf-reader-core"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
browser-tests = []
# Use the Flatpak application prefix instead of the executable-relative package.
packaged-pdfium = []

[dependencies]
pdf-range-reader = { path = "../pdf-range-reader" }
blake3 = "1"
image = { version = "0.25", default-features = false }
pdf-view-common = { path = "../pdf-view-common" }
book-model = { path = "../book-model", default-features = false }
pdfium-render = { workspace = true, features = ["pdfium_latest", "thread_safe"] }
reader-style = { path = "../reader-style" }

[build-dependencies]
sha2 = "0.10"
serde_json = "1"
toml = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
concurrent-queue = "2"
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[[example]]
name = "browser_pdf"
crate-type = ["cdylib"]
required-features = ["browser-tests"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parking_lot = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
pdfium-render = { workspace = true, features = ["static"] }
