[package]
name = "book-model"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["random-ids"]
random-ids = ["uuid/v4"]

[lints]
workspace = true

[dependencies]
prost = "0.14.4"
protobuf-wire = { path = "../protobuf-wire" }
wire = { path = "../wire" }
content-address = { path = "../content-address" }
language-tags = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization.workspace = true
uuid = { version = "1", features = ["v5", "serde"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
