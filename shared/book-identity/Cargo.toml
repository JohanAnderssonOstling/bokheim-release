[package]
name = "book-identity"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
native-write = ["dep:tempfile", "dep:fs2"]

[dependencies]
content-address = { path = "../content-address" }
pdf-range-reader = { path = "../pdf-range-reader" }
lopdf = { version = "0.44", default-features = false }
blake3 = "1"
tempfile = { version = "3", optional = true }
fs2 = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
