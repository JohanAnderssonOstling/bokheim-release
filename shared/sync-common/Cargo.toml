[package]
name = "sync-common"
version = "0.1.0"
edition = "2021"

[features]
sqlite = ["dep:rusqlite"]

[dependencies]
prost = "0.14.4"
rusqlite = { version = "0.40", optional = true }
content-address = { path = "../content-address" }
protobuf-wire = { path = "../protobuf-wire" }
wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
uuid = { version = "1", features = ["v5", "serde"] }

[dev-dependencies]
serde_json = "1"
