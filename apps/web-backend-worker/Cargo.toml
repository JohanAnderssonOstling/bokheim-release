[package]
name = "web-backend-worker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Experimental provider integration; excluded from default and release builds.
google-drive = ["app/google-drive"]

[dependencies]
book-model = { path = "../../shared/book-model" }
app = { path = "../../client/app", default-features = false }
library-backend = { path = "../../client/library-backend" }
subject-projection = { path = "../../shared/subject-projection" }
update-client = { path = "../../client/update-client" }
console_error_panic_hook = "0.1"
futures-channel = "0.3"
futures-util = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "DedicatedWorkerGlobalScope", "ErrorEvent", "PromiseRejectionEvent", "MessageEvent", "MessagePort", "WorkerGlobalScope"] }

client-platform-web = { path = "../../client/platforms/web" }
client-platform-runtime = { path = "../../client/platforms/runtime" }
rmp-serde = "1.3"
log = "0.4"

[[example]]
name = "sync_coordinator"
crate-type = ["cdylib"]

[[example]]
name = "cpu_worker"
crate-type = ["cdylib"]

[[example]]
name = "startup_probe"
crate-type = ["cdylib"]

[dev-dependencies]
wasm-callback = { path = "../../shared/wasm-callback" }
