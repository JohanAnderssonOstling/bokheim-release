[package]
name = "kobo-device"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
kobo-profile = { path = "../../shared/kobo-profile" }
libc = "0.2"
operation-failure = { path = "../../client/operation-failure" }
async-channel = "2"
pbkdf2 = "0.12"
sha1 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
wpa-ctrl = { version = "0.4", path = "../../vendor/wpa-ctrl" }

[dev-dependencies]
tempfile = "3"
