[package]
name = "opds-webview"
license.workspace = true
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bokheim-opds-webview"
path = "src/main.rs"

[dependencies]
client-platform-runtime = { path = "../../client/platforms/runtime" }
anyhow = "1"
app-preferences = { path = "../../client/preferences" }
library-opds = { path = "../../client/library-backend/crates/library-opds" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
getrandom = "0.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tempfile = "3"
zeroize = { version = "1", features = ["serde"] }
tao = "0.34"
url = "2"
wry = { package = "lb-wry", version = "0.53.3" }
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
ui-components = { path = "../components" }
raw-window-handle = "0.6"
reqwest_client = { path = "../../../GPUI-Fork/crates/reqwest_client" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
x11rb = { version = "0.13", features = ["shape"] }
webkit2gtk = { version = "2.0.1", features = ["v2_34"] }
soup = { package = "soup3", version = "0.5" }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
