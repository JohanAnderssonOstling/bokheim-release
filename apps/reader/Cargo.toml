[package]
name = "reader-ui"
version = "0.1.0"
edition = "2024"

[features]
default = ["native-audio"]
native-audio = ["audiobook-player/native-rodio"]
native-tts = ["dep:reader-speech"]
kobo = ["mobile", "dep:gpui_kobo", "app/kobo", "audiobook-player/kobo", "ui-components/kobo", "gpui-image-eviction/kobo"]
mobile = ["ui-components/mobile"]
packaged-pdfium = ["pdf-reader-core/packaged-pdfium"]

[dependencies]
futures-lite = "2"
library-backend = { path = "../../client/library-backend" }
content-address = { path = "../../shared/content-address" }
app-preferences = { path = "../../client/preferences" }
app = { path = "../../client/app", default-features = false }
async-channel = "2"
ui-components = { path = "../components" }
audiobook-player = { path = "../audiobook-player", default-features = false }
gpui = { workspace = true, features = ["snapshot"] }
gpui-component.workspace = true
gpui_kobo = { workspace = true, optional = true }
skrift-column-paginator.workspace = true
html-view-gpui = { path = "../../../HtmlViewCore/adapters/html-view-gpui" }
html.workspace = true
book-content = { path = "../../client/book-content" }
library-model = { path = "../../client/library-model" }
book-model = { path = "../../shared/book-model", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "js"] }
web-time = "1"
unicode-normalization.workspace = true
pdf-reader-core = { path = "../../shared/pdf-reader-core" }
pdf-view-gpui = { path = "crates/pdf/pdf-view" }
fixed-page = { path = "../../shared/fixed-page", features = ["gpui"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp", "tiff"] }
gpui-image-eviction = { path = "../../../HtmlEngine/adapters/gpui-image-eviction" }

[dev-dependencies]
base64 = "0.22"
book-access = { path = "../../client/library-backend/crates/book-access" }
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["snapshot"] }
html-gpui.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reader-speech = { path = "../../shared/reader-speech", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reader-speech = { path = "../../shared/reader-speech" }
