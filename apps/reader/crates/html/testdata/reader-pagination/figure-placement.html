<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Semantic figure placement visual test</title>
  <style>
    body { margin: 44px; color: #20242b; font-family: sans-serif; }
    h1 { margin: 0 0 14px; font-size: 32px; }
    .lead { height: 350px; border-bottom: 2px solid #cad0d8; font-size: 19px; }
    figure { width: 560px; margin: 0; padding: 12px; border: 8px solid #c96b18; background: #ffe4c4; box-sizing: border-box; }
    .art { height: 92px; padding: 24px; background: #ed9b45; box-sizing: border-box; color: #4a2508; font-size: 24px; font-weight: bold; }
    figcaption { padding-top: 10px; font-size: 21px; line-height: 1.35; }
  </style>
</head>
<body>
  <h1>Semantic figure placement</h1>
  <div class="lead">There is room for only part of the figure at the bottom of this page.</div>
  <figure>
    <div class="art">Illustration panel</div>
    <figcaption>Figure 1. The artwork and this caption must begin together on the next reader page.</figcaption>
  </figure>
</body>
</html>
