[package]
name = "browser-ui"
version = "0.1.0"
edition = "2024"

[features]
# Experimental provider integration; excluded from default and release builds.
google-drive = ["app/google-drive"]
default = []
filesystem-libraries = []
kobo = ["mobile", "dep:gpui_kobo", "dep:kobo-update", "ui-components/kobo", "gpui-image-eviction/kobo"]
mobile = ["ui-components/mobile"]

[dependencies]
update-client = { path = "../../client/update-client" }
library-backend = { path = "../../client/library-backend" }
book-model = { path = "../../shared/book-model" }
async-channel = "2"
account-contract = { path = "../../shared/account-contract" }
app-preferences = { path = "../../client/preferences" }
app = { path = "../../client/app", default-features = false }
ui-components = { path = "../components" }
gpui.workspace = true
gpui-image-eviction = { path = "../../../HtmlEngine/adapters/gpui-image-eviction" }
gpui-component.workspace = true
gpui_kobo = { workspace = true, optional = true }
kobo-update = { path = "../../client/kobo-update", optional = true }
image = { version = "0.25", default-features = false }
library-model = { path = "../../client/library-model" }
log = "0.4"
sys-locale = { version = "0.3", features = ["js"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sync-common = { path = "../../shared/sync-common" }
uuid = { version = "1", features = ["v4"] }
web-time = "1"
zune-core = "0.5"
zune-jpeg = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
gpui_android = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
