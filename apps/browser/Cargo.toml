[package]
name = "browser-ui"
version = "0.1.0"
edition = "2024"

[features]
default = []
filesystem-libraries = []
kobo = ["mobile", "dep:gpui_kobo", "ui-components/kobo"]
mobile = ["ui-components/mobile"]

[dependencies]
update-client = { path = "../../shared/update-client" }
library-backend = { path = "../../client/library-backend" }
subject-projection = { path = "../../shared/subject-projection" }
book-model = { path = "../../shared/book-model" }
async-channel = "2"
account-contract = { path = "../../shared/account-contract" }
app-preferences = { path = "../../client/preferences" }
app = { path = "../../client/app", default-features = false }
ui-components = { path = "../components" }
gpui.workspace = true
gpui-component.workspace = true
gpui_kobo = { path = "../../../GPUI-Fork/crates/gpui_kobo", optional = true }
html.workspace = true
html-view-core.workspace = true
html-view-gpui = { path = "../reader/crates/html/crates/html-view-gpui" }
image = { version = "0.25", default-features = false }
library-model = { path = "../../client/library-model" }
log = "0.4"
chrono = "0.4"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
sync-common = { path = "../../shared/sync-common" }
uuid = { version = "1", features = ["v4"] }
web-time = "1"
zune-core = "0.5"
zune-jpeg = "0.5"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
serde_json = "1"
gpui_android = { path = "../../../GPUI-Fork/crates/gpui_android" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
