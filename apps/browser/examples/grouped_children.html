<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library · Grouped child chips</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#30332f;background:#f9faf7;--muted:#74796f;--rule:#dce0d6;--accent:#576944;--wash:#eaf0e1}
*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:hover{background:var(--wash)}
.top{height:64px;border-bottom:1px solid var(--rule);display:flex;align-items:center;padding:0 28px;gap:36px}.brand{font-weight:650;letter-spacing:-.6px;font-size:21px}.top span{color:var(--muted);font-size:13px}.top .badge{margin-left:auto;font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
.shell{display:grid;grid-template-columns:192px 1fr;min-height:calc(100vh - 64px)}aside{border-right:1px solid var(--rule);padding:30px 16px}aside p{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:22px 12px 12px}.nav{border:0;background:transparent;text-align:left;padding:10px 12px;width:100%;border-radius:5px}.nav.active{background:var(--wash);color:var(--accent);font-weight:600}
main{padding:34px 44px 48px;max-width:1440px;width:100%;margin:auto}.crumbs{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin-bottom:24px}.crumbs button{border:0;background:none;padding:0;color:var(--accent)}.heading{display:flex;align-items:center;gap:20px;margin-bottom:30px}h1{font-size:30px;letter-spacing:-.8px;font-weight:600;margin:0}.summary{color:var(--muted);font-size:13px;margin-top:4px}.switch{display:flex;border:1px solid var(--rule);margin-left:auto;border-radius:5px;padding:3px}.switch button{border:0;background:none;padding:6px 14px;font-size:13px;border-radius:3px}.switch .active{background:var(--wash);font-weight:600;color:var(--accent)}
.group{margin-top:34px}.group:first-child{margin-top:0}.group-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}.group-head h2{font-size:17px;font-weight:600;line-height:1.3;margin:0}.group-link{border:0;background:none;padding:0;text-align:left}.group-link:hover{background:none;color:var(--accent);text-decoration:underline}.rule{height:1px;background:var(--rule);flex:1}.group-count{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.chip{border:1px solid var(--rule);display:flex;align-items:center;min-width:0;padding:12px 14px;gap:12px;background:transparent;min-height:58px}.chip:hover{border-color:#99a48c}.open{border:0;background:none;padding:0;display:flex;align-items:center;gap:11px;flex:1;min-width:0;text-align:left}.open:hover{background:none}.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}.icon{width:19px;height:19px;flex:none;color:var(--accent)}.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.download{width:26px;height:26px;flex:none;display:grid;place-items:center}.download button{border:1px solid var(--rule);background:none;width:26px;height:26px;display:grid;place-items:center;padding:3px}.download svg{width:16px;height:16px}
.note{margin-top:46px;border-top:1px solid var(--rule);padding-top:18px;display:flex;gap:20px;font-size:13px;color:var(--muted)}.note strong{color:var(--accent);font-weight:600;white-space:nowrap}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#30392a;color:white;padding:12px 20px;border-radius:6px;box-shadow:0 4px 20px #0002;max-width:90vw;font-size:14px}.toast:empty{display:none}
@media(min-width:1450px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:26px}.shell{grid-template-columns:150px 1fr}.heading{flex-wrap:wrap}.switch{margin-left:0}}@media(max-width:620px){aside{display:none}.shell{display:block}.grid{grid-template-columns:1fr}.note{display:block}.top{padding:0 20px}.top span:not(.badge){display:none}}
</style>
<header class="top"><div class="brand">Bokheim</div><span>Your library, at home.</span><span class="badge">Interactive design mockup</span></header>
<div class="shell"><aside><button class="nav" onclick="home()">Home</button><p>Library</p><button class="nav active" onclick="home()">Subjects</button><button class="nav" onclick="toast('This mockup focuses on subject browsing; folders would use the same grouping rule.')">Folders</button><button class="nav" onclick="toast('Book browsing is outside this mockup.')">Books</button></aside>
<main><nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav><div class="heading"><div><h1 id="title"></h1></div><div class="switch" aria-label="Compare layouts"><button id="current" onclick="setMode(false)">Current</button><button id="grouped" onclick="setMode(true)">Grouped</button></div></div><div id="content"></div><div class="note"><strong>About this mockup</strong><span id="explanation"></span></div></main></div><div class="toast" id="toast" role="status"></div>
<script>
const subjectIcon='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>';
const downIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 17H5a4 4 0 0 1-.2-8 7 7 0 0 1 13.4 0A4 4 0 0 1 19 17h-2M12 11v10m-4-4 4 4 4-4"/></svg>';
const leaf=(name,count,downloaded=true)=>({name,count,direct:count,downloaded,children:[]});
const religion={name:'Religion',count:84,direct:0,downloaded:true,children:[leaf('Christianity',38),leaf('Buddhism',21),leaf('Comparative religion',25)]};
const humanities={name:'Humanities',count:426,direct:0,downloaded:false,children:[leaf('History',128,false),leaf('Philosophy',92),leaf('Literature',76,false),religion,leaf('Languages',46)]};
const science={name:'Natural sciences',count:219,direct:0,downloaded:false,children:[leaf('Mathematics',64),leaf('Physics',58,false),leaf('Biology',71),leaf('Earth sciences',26)]};
const root={name:'Subjects',children:[humanities,science,{name:'Art & design',count:73,direct:14,downloaded:true,children:[leaf('Architecture',31),leaf('Photography',28)]},{name:'Technology',count:146,direct:42,downloaded:false,children:[leaf('Computing',104)]},leaf('Reference',32)]};
let grouped=true,path=[root],timer;
function toast(message){document.getElementById('toast').textContent=message;clearTimeout(timer);timer=setTimeout(()=>document.getElementById('toast').textContent='',4500)}
function home(){path=[root];render()}
function setMode(value){grouped=value;render()}
function enter(node){if(!node.children.length){toast(`${node.name}: ${node.count} books. Book results are not included in this chip mockup.`);return}path.push(node);render()}
function button(label,action,className){const b=document.createElement('button');b.textContent=label;b.onclick=action;b.className=className;return b}
function chip(node){const el=document.createElement('div');el.className='chip';const open=button('',()=>enter(node),'open');open.innerHTML=subjectIcon;const label=document.createElement('span');label.className='label';label.textContent=node.name;open.append(label);el.append(open);const count=document.createElement('span');count.className='count';count.textContent=node.count;el.append(count);const slot=document.createElement('span');slot.className='download';if(!node.downloaded){const download=button('',()=>{node.downloaded=true;render();toast(`${node.name}: download completed in this mockup.`)},'');download.innerHTML=downIcon;download.setAttribute('aria-label',`Download ${node.name}`);download.title='Download remaining books';slot.append(download)}el.append(slot);return el}
function section(nodes,node){const s=document.createElement('section');s.className='group';if(node){const header=document.createElement('div');header.className='group-head';const h=document.createElement('h2');h.append(button(node.name,()=>enter(node),'group-link'));header.append(h);const line=document.createElement('span');line.className='rule';header.append(line);s.append(header)}const grid=document.createElement('div');grid.className='grid';nodes.forEach(n=>grid.append(chip(n)));s.append(grid);return s}
function render(){const node=path.at(-1);document.getElementById('title').textContent=node.name;const crumbs=document.getElementById('crumbs');crumbs.replaceChildren();path.forEach((n,i)=>{if(i){const sep=document.createElement('span');sep.textContent='/';crumbs.append(sep)}crumbs.append(button(n.name,()=>{path=path.slice(0,i+1);render()},''))});document.getElementById('current').className=grouped?'':'active';document.getElementById('grouped').className=grouped?'active':'';document.getElementById('current').setAttribute('aria-pressed',!grouped);document.getElementById('grouped').setAttribute('aria-pressed',grouped);const content=document.getElementById('content');content.replaceChildren();if(!grouped){content.append(section(node.children))}else{let regular=[];const flush=()=>{if(regular.length){content.append(section(regular));regular=[]}};for(const child of node.children){if(child.direct===0&&child.children.length){flush();content.append(section(child.children,child))}else{regular.push(child)}}flush()}document.getElementById('explanation').textContent=grouped?'Humanities and Natural sciences contain no direct books, so their names become headings. Only their immediate children are shown. Religion also contains only subjects, but stays a chip here: there is no recursive expansion. Art & design and Technology contain direct books, so they stay regular chips. Counts are illustrative.':'The current layout shows each immediate subject as a chip. Switch to Grouped to expose one level of children beneath subjects that contain no direct books. Counts are illustrative.'}
render();
</script>
</html>
