[workspace]
resolver = "3"
members = [
    "client/app",
    "client/client-runtime",
    "shared/http-response",
    "client/library-backend",
    "client/library-backend/crates/cloud-storage",
    "client/library-backend/crates/library-database",
    "client/library-backend/crates/library-replica",
    "client/app/crates/library-registry",
    "client/library-backend/crates/thumbnail",
    "client/preferences",
    "client/library-model",
    "client/operation-failure",
    "shared/content-address",
    "shared/pdf-view-common",
    "shared/fixed-page",
    "shared/pdf-reader-core",
    "shared/reader-speech",
    "shared/book-model",
    "shared/audiobook-archive",
    "client/library-backend/crates/audiobook-folder",
    "client/book-content",
    "client/library-backend/crates/book-inspection",
    "shared/subject-projection",
    "shared/subject-taxonomy",
    "shared/account-contract",
    "client/library-backend/crates/library-enrichment",
    "client/library-backend/crates/library-opds",
    "client/library-backend/crates/cpu-host",
    "shared/wire",
    "shared/wasm-callback",
    "shared/protobuf-wire",
    "shared/metadata-contract",
    "shared/update-protocol",
    "shared/update-files",
    "shared/kobo-package",
    "shared/kobo-profile",
    "client/update-client",
    "client/update-host",
    "client/kobo-update",
    "shared/sync-common",
    "apps/desktop-gpui",
    "apps/opds-webview",
    "apps/web-gpui",
    "apps/web-backend-worker",
    "apps/kobo-device",
    "servers/catalog",
    "servers/metadata",
    "servers/updates",
    "servers/taxonomy/curation"
]
exclude = ["servers/sync", "vendor/segment-parser"]

[workspace.package]
license = "GPL-3.0-or-later"

[workspace.lints]

[profile.web-release]
inherits = "release"
lto = true
opt-level = "s"
panic = "unwind"
strip = true

[workspace.dependencies]
blake3 = "1"
# The renderer and reader share the current sibling engine/view workspaces.
html = { package = "skrift", path = "../HtmlEngine/crates/html" }
skrift-column-paginator = { path = "../HtmlViewCore/crates/skrift-column-paginator" }
html-gpui = { path = "../HtmlEngine/adapters/html-gpui" }
kurbo = "0.11.3"
peniko = "0.2.0"
lightningcss = { version = "1.0.0-alpha.72", features = ["substitute_variables"] }
parcel_selectors = "0.28.2"
scraper = "0.27"
unicode-normalization = "0.1"
gpui = { path = "../GPUI-Fork/crates/gpui", version = "=0.2.2", default-features = false, features = ["font-kit", "wayland", "x11", "windows-manifest"] }
gpui_platform = { path = "../GPUI-Fork/crates/gpui_platform", features = ["wayland", "x11"] }
gpui_android = { path = "../GPUI-Fork/crates/gpui_android" }
gpui_kobo = { path = "../GPUI-Fork/crates/gpui_kobo" }
gpui_wgpu = { path = "../GPUI-Fork/crates/gpui_wgpu" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
pdfium-render = { version = "0.9.3", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
mobi = "0.8.0"
encoding_rs = "0.8"
# Keep HTTP/2, response charset decoding, and system proxy support when opting
# out of Reqwest's default TLS backend. All client HTTP users share Rustls 0.23.
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "system-proxy"] }

[patch.crates-io]
sqlite-wasm-vfs = { path = "vendor/sqlite-wasm-vfs" }
# Callback boundaries retain abort behavior while Rust operations can unwind.
wgpu = { path = "vendor/wgpu" }
indexed_db_futures = { path = "vendor/indexed_db_futures" }
wasm-streams = { path = "vendor/wasm-streams" }
mobi = { path = "vendor/mobi" }
async_zip = { path = "vendor/async_zip" }
zip = { path = "vendor/zip" }
gpui = { path = "../GPUI-Fork/crates/gpui", version = "=0.2.2" }
pdfium-render = { path = "vendor/pdfium-render" }
sherpa-onnx-sys = { path = "vendor/sherpa-onnx-sys" }

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../GPUI-Fork/crates/gpui", version = "=0.2.2" }
gpui_macros = { path = "../GPUI-Fork/crates/gpui_macros" }
gpui_platform = { path = "../GPUI-Fork/crates/gpui_platform" }

[patch."https://github.com/zed-industries/wasm_thread"]
wasm_thread = { path = "vendor/wasm_thread" }

# Keep vendored components on the same GPUI source as the application.
[patch."https://github.com/JohanAnderssonOstling/GPUI-Fork"]
gpui = { path = "../GPUI-Fork/crates/gpui", version = "=0.2.2" }
gpui_macros = { path = "../GPUI-Fork/crates/gpui_macros" }
gpui_platform = { path = "../GPUI-Fork/crates/gpui_platform" }

# See vendor/gpui-component/LOCAL-PATCHES.md.
[patch."https://github.com/longbridge/gpui-component"]
gpui-component = { path = "vendor/gpui-component/crates/ui" }
gpui-component-assets = { path = "vendor/gpui-component/crates/assets" }
