[package]
name = "client-platform-kobo"
version = "0.1.0"
edition = "2021"

[features]
device = ["dep:kobo-device"]

[dependencies]
kobo-profile = { path = "../../../shared/kobo-profile" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1", features = ["v4"] }
kobo-device = { path = "../../../apps/kobo-device", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
