[package]
name = "book-access"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
sqlite-cache = ["dep:rusqlite", "dep:log"]
pdf = ["dep:pdf-view-common"]
web-runtime-tests = []

[dependencies]
client-platform-runtime = { path = "../../../platforms/runtime" }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
log = { version = "0.4", optional = true }
sync-common = { path = "../../../../shared/sync-common" }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["macros", "sync"] }
pdf-view-common = { path = "../../../../shared/pdf-view-common", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "time", "net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
client-platform-web = { path = "../../../platforms/web" }
reqwest = { version = "0.11", default-features = false, features = ["stream"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
futures-channel = "0.3"

[dev-dependencies]
tempfile = "3"
zip.workspace = true
epub_provider = { path = "../../../../shared/epub" }
test-support = { path = "../../../test-support" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread"] }
