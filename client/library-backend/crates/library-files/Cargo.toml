[package]
name = "library-files"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
client-runtime = { path = "../../../client-runtime" }
library-model = { path = "../../../library-model" }
library-replica = { path = "../library-replica" }
book-access = { path = "../book-access" }
content-address = { path = "../../../../shared/content-address" }
client-platform-runtime = { path = "../../../platforms/runtime" }
thumbnail = { path = "../thumbnail" }
sync-common = { path = "../../../../shared/sync-common" }
blake3 = "1"
futures-util = { version = "0.3", features = ["io"] }
log = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
audiobook-archive = { path = "../../../../shared/audiobook-archive" }
audiobook-folder = { path = "../audiobook-folder" }
client-platform-native = { path = "../../../platforms/native" }
reqwest = { workspace = true, default-features = false, features = ["stream", "rustls-tls"] }
tempfile = "3"
fs2 = "0.4"
walkdir = "2.5"
tokio = { version = "1", features = ["fs", "io-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
client-platform-web = { path = "../../../platforms/web" }
web-sys = { version = "0.3", features = ["Blob", "File"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
reqwest = { workspace = true, default-features = false, features = ["stream"] }

[dev-dependencies]
zip.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
client-platform-android = { path = "../../../platforms/android" }
