[package]
name = "library-database"
version = "0.1.0"
edition = "2024"
publish = false
# SQL fixture tests run as crate modules so their raw SQL stays private.
autotests = false

[features]
scanner = []

[dependencies]
blake3 = "1"
content-address = { path = "../../../../shared/content-address", features = ["sqlite"] }
client-runtime = { path = "../../../client-runtime" }
book-model = { path = "../../../../shared/book-model" }
client-platform-runtime = { path = "../../../platforms/runtime" }
device-sqlite = { path = "../../../device-sqlite" }
library-model = { path = "../../../library-model", default-features = false }
library-replica = { path = "../library-replica", default-features = false }
sync-common = { path = "../../../../shared/sync-common", default-features = false, features = ["sqlite"] }
subject-projection = { path = "../../../../shared/subject-projection" }
metadata-contract = { path = "../../../../shared/metadata-contract" }
book-inspection = { path = "../book-inspection" }
pdf-view-common = { path = "../../../../shared/pdf-view-common" }
rusqlite = { version = "0.40.0", features = ["backup", "bundled", "functions", "hooks", "limits"] }
include-sqlite-sql = "0.2.1"
log = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v5"] }
web-time = "1"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
client-platform-web = { path = "../../../platforms/web" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
client-platform-native = { path = "../../../platforms/native" }



[[test]]
name = "versioned_state"
path = "tests/versioned_state.rs"

[[test]]
name = "catalog_pagination"
path = "tests/catalog_pagination.rs"
