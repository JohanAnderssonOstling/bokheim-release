[package]
name = "cpu-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
content-address = { path = "../../../../shared/content-address" }
book-model = { path = "../../../../shared/book-model" }
book-metadata = { path = "../book-metadata" }
book-inspection = { path = "../book-inspection" }
thumbnail = { path = "../thumbnail" }
client-runtime = { path = "../../../client-runtime" }
client-platform-runtime = { path = "../../../platforms/runtime" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
serde_bytes = "0.11"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png"] }
