[package]
name = "cloud-storage"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Experimental provider integration; excluded from default and release builds.
google-drive = ["dep:base64", "dep:sha2", "dep:getrandom"]
test-support = []

[dependencies]
http-response = { path = "../../../../shared/http-response" }
operation-failure = { path = "../../../operation-failure" }
sync-common = { path = "../../../../shared/sync-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }
tokio = { version = "1", features = ["sync"] }
web-time = "1"
url = { version = "2", features = ["serde"] }
reqwest = { workspace = true, features = ["json", "stream"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "sync", "time"] }

[lints]
workspace = true

[[example]]
name = "google_drive_live"
required-features = ["google-drive"]
