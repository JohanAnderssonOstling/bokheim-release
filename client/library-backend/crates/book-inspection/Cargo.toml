[package]
name = "book-inspection"
version = "0.1.0"
edition = "2021"
publish = false

[features]
mobi = ["dep:mobi"]

[lints]
workspace = true

[dependencies]
pdf-range-reader = { path = "../../../../shared/pdf-range-reader" }
mobi = { workspace = true, optional = true }
book-enrichment = { path = "../book-enrichment" }
pdf-reader-core = { path = "../../../../shared/pdf-reader-core" }
metadata-contract = { path = "../../../../shared/metadata-contract" }
epub_provider = { path = "../../../../shared/epub" }
lopdf = { version = "0.44", default-features = false }
book-model = { path = "../../../../shared/book-model" }
roxmltree = "0.20"
regex = "1"
quick-xml = "0.31"
subject-projection = { path = "../../../../shared/subject-projection" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[dev-dependencies]
zip.workspace = true
tempfile = "3"

[[example]]
name = "survey_mobi"
required-features = ["mobi"]
