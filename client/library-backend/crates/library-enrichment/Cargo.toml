[package]
name = "library-enrichment"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
http-response = { path = "../../../../shared/http-response" }
asset-transfer = { path = "../asset-transfer" }
book-inspection = { path = "../book-inspection" }
book-model = { path = "../../../../shared/book-model" }
cpu-host = { path = "../cpu-host" }
library-database = { path = "../library-database" }
library-files = { path = "../library-files" }
library-model = { path = "../../../library-model" }
library-runtime = { path = "../library-runtime" }
log = "0.4"
sync-common = { path = "../../../../shared/sync-common" }
web-time = "1"
serde_json = "1"
futures-util = "0.3"
metadata-contract = { path = "../../../../shared/metadata-contract" }
reqwest = { workspace = true, default-features = false, features = ["stream"] }
tokio = { version = "1", features = ["sync"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "test-util"] }
axum = "0.7"
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["rustls-tls", "stream"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
client-platform-native = { path = "../../../platforms/native" }
