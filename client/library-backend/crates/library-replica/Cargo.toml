[package]
name = "library-replica"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["random-ids"]
random-ids = ["library-model/random-ids"]

[dependencies]
# Keep compatibility normalization consistent across replicas.
unicode-normalization = "=0.1.25"
metadata-contract = { path = "../../../../shared/metadata-contract" }
book-model = { path = "../../../../shared/book-model" }
pdf-view-common = { path = "../../../../shared/pdf-view-common" }
library-model = { path = "../../../library-model", default-features = false }
serde = { version = "1", features = ["derive"] }
sync-common = { path = "../../../../shared/sync-common", default-features = false }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
