[package]
name = "library-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
client-runtime = { path = "../../../client-runtime" }
account-client = { path = "../../../account-client" }
async-channel = "2"
client-platform-runtime = { path = "../../../platforms/runtime" }
library-database = { path = "../library-database" }
library-model = { path = "../../../library-model", default-features = false }
library-replica = { path = "../library-replica", default-features = false }
sync-common = { path = "../../../../shared/sync-common", default-features = false }
sync-transport = { path = "../sync-transport" }
tokio = { version = "1", features = ["sync"] }
web-time = "1"
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
client-platform-web = { path = "../../../platforms/web" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
client-platform-native = { path = "../../../platforms/native" }
