[package]
name = "import-pipeline"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
blake3 = "1"
book-model = { path = "../../../../shared/book-model" }
client-runtime = { path = "../../../client-runtime" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sync-common = { path = "../../../../shared/sync-common" }
uuid = { version = "1.0", features = ["v4"] }
web-time = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
