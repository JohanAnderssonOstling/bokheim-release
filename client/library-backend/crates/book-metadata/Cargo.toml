[package]
name = "book-metadata"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
audiobook-folder = { path = "../../../../shared/audiobook-folder" }
book-model = { path = "../../../../shared/book-model" }
content-address = { path = "../../../../shared/content-address" }
pdf-reader-core = { path = "../../../../shared/pdf-reader-core" }
pdf-view-common = { path = "../../../../shared/pdf-view-common" }
metadata-contract = { path = "../../../../shared/metadata-contract" }
library-model = { path = "../../../library-model" }
book-inspection = { path = "../book-inspection", features = ["mobi"] }
mobi = { workspace = true }
mp4ameta = { version = "0.13.0" }
serde = { version = "1", features = ["derive"] }
zip.workspace = true
encoding_rs = "0.8"
log = "0.4"
blake3.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

[[example]]
name = "survey_titles"
