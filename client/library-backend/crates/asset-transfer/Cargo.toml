[package]
name = "asset-transfer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
book-access = { path = "../book-access" }
audiobook-archive = { path = "../../../../shared/audiobook-archive" }
book-model = { path = "../../../../shared/book-model" }
client-runtime = { path = "../../../client-runtime", features = ["http"] }
cpu-host = { path = "../cpu-host" }
thumbnail = { path = "../thumbnail" }
library-files = { path = "../library-files" }
library-database = { path = "../library-database" }
library-runtime = { path = "../library-runtime" }
client-platform-runtime = { path = "../../../platforms/runtime" }
rusqlite = { version = "0.40", features = ["bundled"] }
futures-util = "0.3"

library-model = { path = "../../../library-model" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
sync-common = { path = "../../../../shared/sync-common" }
sync-transport = { path = "../sync-transport" }
tokio = { version = "1", features = ["macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
account-client = { path = "../../../account-client" }
tempfile = "3"
book-inspection = { path = "../book-inspection" }
library-database = { path = "../library-database" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "test-util"] }



[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["stream", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
client-platform-web = { path = "../../../platforms/web" }
reqwest = { workspace = true, default-features = false, features = ["stream"] }
