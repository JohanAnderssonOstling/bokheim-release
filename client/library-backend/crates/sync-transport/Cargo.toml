[package]
name = "sync-transport"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
http-response = { path = "../../../../shared/http-response" }
log = "0.4"
web-time = "1"
uuid = { version = "1", features = ["v4", "js"] }
sync-common = { path = "../../../../shared/sync-common", default-features = false }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
httpdate = "1"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["stream"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["rustls-tls", "stream", "gzip"] }

[dev-dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
