[package]
name = "library-registry"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
device-sqlite = { path = "../../../device-sqlite" }
sync-common = { path = "../../../../shared/sync-common" }
rusqlite = "0.40.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
