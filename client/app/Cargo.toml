[package]
name = "app"
version = "0.1.0"
description = "Bokheim application backend"
edition = "2021"
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["rlib"]

[features]
web-runtime-tests = ["client-platform-web/web-runtime-tests", "library-backend/web-runtime-tests", "client-platform-runtime/web-runtime-tests"]
kobo = ["client-platform-kobo/device"]

[dependencies]
client-runtime = { path = "../client-runtime" }
cpu-host = { path = "../library-backend/crates/cpu-host" }
thumbnail = { path = "../library-backend/crates/thumbnail" }
client-platform-desktop = { path = "crates/platform-desktop" }
client-platform-runtime = { path = "../platforms/runtime" }
account-contract = { path = "../../shared/account-contract" }
library-registry = { path = "crates/library-registry" }
app-preferences = { path = "../preferences" }
library-backend = { path = "../library-backend" }
account-client = { path = "../account-client" }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time"] }
futures-util = { version = "0.3", features = ["io"] }
async-channel = "2"
sync-common = { path = "../../shared/sync-common" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
import-pipeline = { path = "../library-backend/crates/import-pipeline" }
client-platform-web = { path = "../platforms/web" }
futures-channel = "0.3"
# Enable browser entropy for transitive dependencies using these getrandom versions.
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom-04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Event", "EventTarget", "File", "DedicatedWorkerGlobalScope", "MessageChannel", "MessageEvent", "MessageEventInit", "MessagePort", "SharedWorker", "Worker", "WorkerOptions", "WorkerType"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
client-platform-native = { path = "../platforms/native", features = ["websocket"] }
client-platform-kobo = { path = "../platforms/kobo" }
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rmp-serde = "1.3"
test-support = { path = "../test-support", features = ["pdf-fixtures"] }
tempfile = "3"
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.0", features = ["test-util"] }
