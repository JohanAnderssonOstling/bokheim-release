[package]
name = "app"
version = "0.1.0"
description = "Bokheim application backend"
edition = "2021"
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["rlib"]

[features]
# Experimental provider integration; excluded from default and release builds.
google-drive = ["cloud-storage/google-drive", "library-backend/google-drive", "client-platform-web/google-drive"]
kobo = ["client-platform-kobo/device", "library-backend/kobo"]

[dependencies]
client-runtime = { path = "../client-runtime", features = ["http"] }
cpu-host = { path = "../library-backend/crates/cpu-host" }
thumbnail = { path = "../library-backend/crates/thumbnail" }
client-platform-desktop = { path = "crates/platform-desktop" }
library-runtime = { path = "../library-backend/crates/library-runtime" }
cloud-storage = { path = "../library-backend/crates/cloud-storage" }
client-platform-runtime = { path = "../platforms/runtime" }
account-contract = { path = "../../shared/account-contract" }
library-registry = { path = "crates/library-registry" }
app-preferences = { path = "../preferences" }
library-backend = { path = "../library-backend" }
library-database = { path = "../library-backend/crates/library-database" }
library-model = { path = "../library-model" }
account-client = { path = "../account-client" }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
web-time = "1"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time"] }
futures-util = { version = "0.3", features = ["io"] }
async-channel = "2"
sync-common = { path = "../../shared/sync-common" }
update-client = { path = "../update-client" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
library-sync = { path = "../library-backend/crates/library-sync" }
client-platform-web = { path = "../platforms/web" }
subject-projection = { path = "../../shared/subject-projection" }
futures-channel = "0.3"
# Enable browser entropy for transitive dependencies using these getrandom versions.
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom-04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Event", "EventTarget", "File", "DedicatedWorkerGlobalScope", "MessageChannel", "MessageEvent", "MessageEventInit", "MessagePort", "Response", "WorkerGlobalScope", "SharedWorker", "Worker", "WorkerOptions", "WorkerType"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
client-platform-native = { path = "../platforms/native", features = ["websocket"] }
client-platform-kobo = { path = "../platforms/kobo" }
# OPDS feeds are native only: a browser may fetch only from servers that
# allow it, and most OPDS servers do not.
library-opds = { path = "../library-backend/crates/library-opds" }
# A store window's downloads are placed into the library root from here.
library-files = { path = "../library-backend/crates/library-files" }
tempfile = "3"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
book-content = { path = "../book-content" }
futures-lite = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.0", features = ["test-util"] }

[target.'cfg(target_os = "android")'.dependencies]
client-platform-android = { path = "../platforms/android" }
