[package]
name = "book-content"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async_zip = { version = "0.0.19", default-features = false, features = ["deflate"] }
futures-lite = "2"
futures-util = { version = "0.3", features = ["io"] }
quick-xml = "0.31"
serde_json = "1"
book-model = { path = "../../shared/book-model", default-features = false }
mobi.workspace = true
encoding_rs = "0.8"
percent-encoding = "2"
regex = "1"
scraper.workspace = true
base64 = "0.22"

[dev-dependencies]
zip.workspace = true
