name: Distribute completed release packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform packages to upload
        type: choice
        options: [windows, macos, kobo]
        required: true
      run_id:
        description: Completed packaging run, or 0 to create the binary release draft
        type: string
        required: true
      source_commit:
        description: Application source commit
        type: string
        required: true
      workflow_commit:
        description: Packaging workflow commit
        type: string
        required: false
      tag:
        description: Version tag
        type: string
        required: true
permissions:
  actions: read
  contents: write
concurrency:
  group: distribute-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    if: inputs.run_id == '0'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_NOTES: |
        Bokheim 0.1.12
        
        - Improved reader rendering, text selection, dictionaries, and annotation workflows.
        - Improved Windows import recovery and path handling.
        - Folder-picker imports retain completed files for retry when book inspection fails.
        - Long library paths now use a middle ellipsis while keeping the storage columns aligned.
        - Removed the signed-out cloud-storage hint from library rows.
        - Book keyboard focus now uses a light accent fill.
        - Performance and memory improvements across browsing, cover loading, fonts, and text layout.
        
        Release binaries and checksums are included below.
    steps:
      - name: Create version tag and binary release draft
        run: |
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_COMMIT"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Bokheim ${RELEASE_TAG#v}" --notes "$RELEASE_NOTES"
  upload:
    if: inputs.run_id != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PLATFORM: ${{ inputs.platform }}
      RUN_ID: ${{ inputs.run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Upload completed binary packages
        run: |
          python3 - <<'PY_UPLOAD'
          import os, subprocess, tempfile
          from pathlib import Path
          platform = os.environ['PLATFORM']
          names = {'windows': ['bokheim-desktop-windows-x86-64'],
                   'macos': ['bokheim-macos-universal'],
                   'kobo': ['bokheim-kobo-installer-windows-x86-64', 'bokheim-kobo-installer-linux-x86-64']}[platform]
          with tempfile.TemporaryDirectory() as scratch:
              for name in names:
                  subprocess.run(['gh', 'run', 'download', os.environ['RUN_ID'], '--name', name, '--dir', scratch], check=True)
              directory = Path(scratch)
              if platform == 'windows':
                  (directory / 'desktop-source-commit.txt').write_text(os.environ['SOURCE_COMMIT'] + '\n')
              files = [str(p) for p in directory.iterdir() if p.is_file()]
              subprocess.run(['gh', 'release', 'upload', os.environ['RELEASE_TAG'], '--clobber', *files], check=True)
              print('Uploaded', platform, 'packages')
          PY_UPLOAD
