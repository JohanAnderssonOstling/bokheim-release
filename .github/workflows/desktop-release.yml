name: Windows release
run-name: Release Windows — ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the Windows builds to the shared draft release for this version
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  statuses: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  RUST_VERSION: 1.95.0
  GPUI_FORK_REF: cb2f5b981889d421153d5804526929e32c0788fd
  HTML_ENGINE_REF: 91766fb2db8d56b38dc0336ddf74972da9872520
  HTML_VIEW_CORE_REF: 0d407738fd6ecfd6d6ea84f1a9ce0a488e3dfaf7
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  APPIMAGETOOL_VERSION: 1.9.1
  BOKHEIM_UPDATE_PUBLIC_KEY_HEX: ${{ vars.BOKHEIM_UPDATE_PUBLIC_KEY_HEX || 'f9e4a3504b65243b84d497bc3b0434793803c794c0db129701ea563d0a51efa3' }}
  BOKHEIM_UPDATE_KEY_ID: ${{ vars.BOKHEIM_UPDATE_KEY_ID || 'release-1' }}
  BOKHEIM_UPDATE_ENDPOINT: ${{ vars.BOKHEIM_UPDATE_ENDPOINT || 'https://updates.bokheim.se/v1/stable' }}

jobs:
  shared-tests:
    name: Require local shared tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Require shared tests for this source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/require-shared-tests.py "${{ github.repository }}" "$GITHUB_SHA"

  windows-checks:
    needs: shared-tests
    uses: ./.github/workflows/client-platforms.yml

  build-windows:
    needs: windows-checks
    name: x86-64 Windows installer
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Set up PDFium preparation tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out Bokheim
        uses: actions/checkout@v6
        with:
          path: bokheim

      - name: Check out GPUI-Fork
        uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/GPUI-Fork
          ref: ${{ env.GPUI_FORK_REF }}
          path: GPUI-Fork

      - name: Check out HtmlEngine
        uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlEngine
          ref: ${{ env.HTML_ENGINE_REF }}
          path: HtmlEngine

      - name: Check out HtmlViewCore
        uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlViewCore
          ref: ${{ env.HTML_VIEW_CORE_REF }}
          path: HtmlViewCore

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Restore Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bokheim-windows-v1
          shared-key: desktop-windows-x86-64
          key: gpui-${{ env.GPUI_FORK_REF }}-engine-${{ env.HTML_ENGINE_REF }}-view-${{ env.HTML_VIEW_CORE_REF }}
          workspaces: bokheim -> target
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Read and check desktop version
        working-directory: bokheim
        shell: pwsh
        run: |
          $line = Select-String -Path "apps/desktop-gpui/Cargo.toml" -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          "BOKHEIM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($env:GITHUB_REF.StartsWith("refs/tags/") -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop version v$version"
          }

      - name: Verify the desktop dependency graph is GPUI-only
        working-directory: bokheim
        shell: pwsh
        run: |
          $tree = cargo tree -p desktop-gpui --no-default-features --features desktop
          $tree | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "desktop-dependency-tree.txt") -Encoding utf8
          if ($tree | Select-String -Pattern '(^|\s)(tauri|wry|webkit2gtk|mobileapp)(\s|$)' -CaseSensitive:$false) {
            throw "The GPUI Windows build must not depend on Tauri or the mobile application."
          }

      - name: Build GPUI desktop release
        working-directory: bokheim
        shell: pwsh
        run: python apps/desktop-gpui/scripts/build.py

      - name: Build Windows installer
        working-directory: bokheim
        shell: pwsh
        run: |
          $installer = "Bokheim-Windows-x86_64-Setup.exe"
          $sourceExe = (Resolve-Path "target/release/desktop-gpui.exe").Path
          $iconFile = (Resolve-Path "apps/ui/design-tokens/assets/icon/favicon.ico").Path
          $outputDir = Join-Path $PWD "release"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $isccCommand = Get-Command iscc.exe -ErrorAction SilentlyContinue
          $iscc = if ($isccCommand) { $isccCommand.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler was not found"
          }
          & $iscc "/DMyAppVersion=$env:BOKHEIM_VERSION" "/DSourceExe=$sourceExe" "/DOutputDir=$outputDir" "/DIconFile=$iconFile" "apps/desktop-gpui/windows/Bokheim.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $hash = (Get-FileHash -Algorithm SHA256 "release/$installer").Hash.ToLowerInvariant()
          "$hash  $installer" | Out-File -FilePath "release/$installer.sha256" -Encoding ascii

      - name: Package complete Windows update
        working-directory: bokheim
        shell: pwsh
        run: |
          python apps/desktop-gpui/windows/package-update.py --binary target/release/desktop-gpui.exe --icon apps/ui/design-tokens/assets/icon/favicon.ico --output release/Bokheim-Windows-x86_64-Update.zip
          if ($LASTEXITCODE -ne 0) { throw "Windows update packaging failed" }

      - name: Verify packaged Windows update metadata
        working-directory: bokheim
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "windows-update-probe"
          Expand-Archive -Path "release/Bokheim-Windows-x86_64-Update.zip" -DestinationPath $probe -Force
          $info = & (Join-Path $probe "Bokheim.exe") --bokheim-update-info
          if ($LASTEXITCODE -ne 0) { throw "Packaged update metadata probe failed" }
          $metadata = $info | ConvertFrom-Json
          if ($metadata.target -ne "windows-x86_64-zip" -or $metadata.application -ne $env:BOKHEIM_VERSION -or $metadata.schema -le 0) {
            throw "Packaged Windows update has invalid compatibility metadata"
          }
          $info | Set-Content -Encoding utf8 "release/update-info-windows-x86_64-zip.json"

      - name: Verify Windows installer
        working-directory: bokheim
        shell: pwsh
        run: |
          $installer = "release/Bokheim-Windows-x86_64-Setup.exe"
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -eq 0) {
            throw "The Windows installer is missing or empty"
          }
          $signature = [System.IO.File]::ReadAllBytes($installer)[0..1]
          if ($signature[0] -ne 0x4d -or $signature[1] -ne 0x5a) {
            throw "The Windows installer is not a PE executable"
          }

      - name: Record verified Windows artifacts
        working-directory: bokheim
        shell: pwsh
        run: python scripts/ci/release_artifacts.py record windows --directory release --repository "${{ github.repository }}"

      - name: Retain workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: bokheim-desktop-windows-x86-64
          path: bokheim/release/*
          if-no-files-found: error


  publish-draft:
    permissions:
      contents: write
      statuses: read
    name: Publish verified draft artifacts
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Require shared tests for the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci/require-shared-tests.py "$SOURCE_REPOSITORY" "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@v8
        with:
          pattern: bokheim-desktop-*
          path: release
          merge-multiple: true
      - name: Upload verified Windows artifacts to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^\"]*\)"/\1/p' apps/desktop-gpui/Cargo.toml | head -n 1)
          python3 scripts/ci/release_artifacts.py upload windows --directory release --repository "${{ github.repository }}" --tag "v$VERSION"
