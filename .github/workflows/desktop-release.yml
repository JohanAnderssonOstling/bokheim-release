name: Windows release
run-name: Release Windows — ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the Windows builds to the shared draft release for this version
        required: true
        type: boolean
        default: false
      source_commit:
        description: Optional application source commit for build-only packaging
        type: string
        required: false
      build_only:
        description: Build packages without running or requiring tests
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  statuses: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  RUST_VERSION: stable
  GPUI_FORK_REF: 6b1ef5fab98df3c62babc7c9245ccffde5a493a2
  HTML_ENGINE_REF: 90bf31db848ec7ad5c405d37fd6027e532d34403
  HTML_VIEW_CORE_REF: 60aa193d0381479e06811378decf7f09f0d93f6e
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  APPIMAGETOOL_VERSION: 1.9.1
  BOKHEIM_UPDATE_PUBLIC_KEY_HEX: ${{ vars.BOKHEIM_UPDATE_PUBLIC_KEY_HEX || 'f9e4a3504b65243b84d497bc3b0434793803c794c0db129701ea563d0a51efa3' }}
  BOKHEIM_UPDATE_KEY_ID: ${{ vars.BOKHEIM_UPDATE_KEY_ID || 'release-1' }}
  BOKHEIM_UPDATE_ENDPOINT: ${{ vars.BOKHEIM_UPDATE_ENDPOINT || 'https://updates.bokheim.se/v1/stable' }}

jobs:
  windows-checks:
    if: inputs.build_only != true
    uses: ./.github/workflows/client-platforms.yml

  build-windows:
    name: x86-64 Windows installer and portable app
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Validate application source selection
        shell: pwsh
        env:
          PINNED_SOURCE: ${{ inputs.source_commit }}
          BUILD_ONLY: ${{ inputs.build_only || false }}
        run: |
          if ($env:PINNED_SOURCE -and $env:BUILD_ONLY -ne "true") {
            throw "A separately pinned application source requires build_only=true."
          }

      - name: Set up PDFium preparation tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out Bokheim
        uses: actions/checkout@v6
        with:
          path: bokheim
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Check out GPUI-Fork
        uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/GPUI-Fork
          ref: ${{ env.GPUI_FORK_REF }}
          path: GPUI-Fork

      - name: Check out HtmlEngine
        uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlEngine
          ref: ${{ env.HTML_ENGINE_REF }}
          path: HtmlEngine

      - name: Check out HtmlViewCore
        uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlViewCore
          ref: ${{ env.HTML_VIEW_CORE_REF }}
          path: HtmlViewCore

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Restore Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bokheim-windows-v1
          shared-key: desktop-windows-x86-64
          key: gpui-${{ env.GPUI_FORK_REF }}-engine-${{ env.HTML_ENGINE_REF }}-view-${{ env.HTML_VIEW_CORE_REF }}
          workspaces: bokheim -> target
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Prepare native speech libraries
        working-directory: bokheim
        shell: python {0}
        run: |
          import os, platform, tarfile, tomllib, urllib.request
          from pathlib import Path
          version = tomllib.loads(Path('vendor/sherpa-onnx-sys/Cargo.toml').read_text())['package']['version']
          if platform.system() == 'Windows':
              suffix, library = 'win-x64-static-MT-Release-lib', 'sherpa-onnx-c-api.lib'
          else:
              arch = 'arm64' if platform.machine() == 'arm64' else 'x64'
              suffix, library = f'osx-{arch}-static-lib', 'libsherpa-onnx-c-api.a'
          stem = f'sherpa-onnx-v{version}-{suffix}'
          destination = Path(os.environ['RUNNER_TEMP']) / 'bokheim-native-speech'
          destination.mkdir(exist_ok=True)
          archive = destination / (stem + '.tar.bz2')
          url = f'https://github.com/k2-fsa/sherpa-onnx/releases/download/v{version}/{archive.name}'
          urllib.request.urlretrieve(url, archive)
          with tarfile.open(archive, 'r:bz2') as source:
              source.extractall(destination, filter='data')
          lib = destination / stem / 'lib'
          assert (lib / library).is_file(), f'Missing speech library: {lib / library}'
          assert (lib / library).stat().st_size > 0
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'SHERPA_ONNX_LIB_DIR={lib}\n')
          print(f'Prepared native speech libraries: {lib}')

      - name: Read and check desktop version
        working-directory: bokheim
        shell: pwsh
        run: |
          $line = Select-String -Path "apps/desktop-gpui/Cargo.toml" -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          "BOKHEIM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($env:GITHUB_REF.StartsWith("refs/tags/") -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop version v$version"
          }

      - name: Verify the desktop dependency graph is GPUI-only
        working-directory: bokheim
        shell: pwsh
        run: |
          $tree = cargo tree -p desktop-gpui --no-default-features --features desktop
          $tree | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "desktop-dependency-tree.txt") -Encoding utf8
          if ($tree | Select-String -Pattern '(^|\s)(tauri|wry|webkit2gtk|mobileapp)(\s|$)' -CaseSensitive:$false) {
            throw "The GPUI Windows build must not depend on Tauri or the mobile application."
          }

      - name: Verify live account protocol compatibility
        working-directory: bokheim
        shell: bash
        run: python scripts/ci/check-server-protocol.py "$(git rev-parse HEAD)"

      - name: Build GPUI desktop release
        working-directory: bokheim
        shell: pwsh
        run: python apps/desktop-gpui/scripts/build.py --no-google-drive

      - name: Build Windows installer
        working-directory: bokheim
        shell: pwsh
        run: |
          $installer = "Bokheim-Windows-x86_64-Setup.exe"
          $sourceExe = (Resolve-Path "target/release/bokheim.exe").Path
          $iconFile = (Resolve-Path "apps/ui/design-tokens/assets/icon/favicon.ico").Path
          $outputDir = Join-Path $PWD "release"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $isccCommand = Get-Command iscc.exe -ErrorAction SilentlyContinue
          $iscc = if ($isccCommand) { $isccCommand.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler was not found"
          }
          & $iscc "/DMyAppVersion=$env:BOKHEIM_VERSION" "/DSourceExe=$sourceExe" "/DOutputDir=$outputDir" "/DIconFile=$iconFile" "apps/desktop-gpui/windows/Bokheim.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $hash = (Get-FileHash -Algorithm SHA256 "release/$installer").Hash.ToLowerInvariant()
          "$hash  $installer" | Out-File -FilePath "release/$installer.sha256" -Encoding ascii

      - name: Package complete Windows update and portable app
        working-directory: bokheim
        shell: pwsh
        run: |
          python apps/desktop-gpui/windows/package-update.py --binary target/release/bokheim.exe --icon apps/ui/design-tokens/assets/icon/favicon.ico --output release/Bokheim-Windows-x86_64-Update.zip --portable-output release/Bokheim-Windows-x86_64-Portable.zip
          if ($LASTEXITCODE -ne 0) { throw "Windows update packaging failed" }

      - name: Build and test single-file Windows app
        working-directory: bokheim
        shell: pwsh
        run: |
          cargo test --release --locked --manifest-path apps/desktop-gpui/windows/standalone/Cargo.toml --target-dir target/windows-standalone
          if ($LASTEXITCODE -ne 0) { throw "Standalone launcher tests failed" }
          python apps/desktop-gpui/windows/package-standalone.py --archive release/Bokheim-Windows-x86_64-Portable.zip --output release/Bokheim-Windows-x86_64-Standalone.exe
          if ($LASTEXITCODE -ne 0) { throw "Standalone executable packaging failed" }

      - name: Verify portable Windows runtime and update metadata
        working-directory: bokheim
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "windows-update-probe"
          $updateHash = (Get-FileHash -Algorithm SHA256 "release/Bokheim-Windows-x86_64-Update.zip").Hash
          $portableHash = (Get-FileHash -Algorithm SHA256 "release/Bokheim-Windows-x86_64-Portable.zip").Hash
          if ($updateHash -ne $portableHash) { throw "Portable and update runtime packages differ" }
          Expand-Archive -Path "release/Bokheim-Windows-x86_64-Portable.zip" -DestinationPath $probe -Force
          $stdout = Join-Path $env:RUNNER_TEMP "windows-update-info.stdout"
          $stderr = Join-Path $env:RUNNER_TEMP "windows-update-info.stderr"
          $process = Start-Process -FilePath (Join-Path $probe "Bokheim.exe") -ArgumentList "--bokheim-update-info" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($process.ExitCode -ne 0) {
            Get-Content $stderr
            throw "Packaged update metadata probe failed with exit code $($process.ExitCode)"
          }
          $info = Get-Content -Raw $stdout
          $metadata = $info | ConvertFrom-Json
          if ($metadata.target -ne "windows-x86_64-zip" -or $metadata.application -ne $env:BOKHEIM_VERSION -or $metadata.schema -le 0) {
            throw "Packaged Windows update has invalid compatibility metadata"
          }
          $info | Set-Content -Encoding utf8 "release/update-info-windows-x86_64-zip.json"

      - name: Verify first and cached standalone launches
        working-directory: bokheim
        shell: pwsh
        run: |
          $payloadHash = (Get-FileHash -Algorithm SHA256 "release/Bokheim-Windows-x86_64-Portable.zip").Hash.ToLowerInvariant()
          $runtime = Join-Path $env:LOCALAPPDATA "Bokheim\Standalone\$payloadHash"
          $standalone = (Resolve-Path "release/Bokheim-Windows-x86_64-Standalone.exe").Path
          $expected = Get-Content -Raw "release/update-info-windows-x86_64-zip.json" | ConvertFrom-Json | ConvertTo-Json -Depth 10 -Compress
          $preparedAt = $null
          foreach ($attempt in 1..2) {
            $stdout = Join-Path $env:RUNNER_TEMP "standalone-$attempt.stdout"
            $stderr = Join-Path $env:RUNNER_TEMP "standalone-$attempt.stderr"
            $process = Start-Process -FilePath $standalone -ArgumentList "--bokheim-update-info" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if ($process.ExitCode -ne 0) { throw "Standalone launch $attempt failed with exit code $($process.ExitCode): $(Get-Content -Raw $stderr)" }
            $actual = Get-Content -Raw $stdout | ConvertFrom-Json | ConvertTo-Json -Depth 10 -Compress
            if ($actual -ne $expected) { throw "Standalone runtime metadata differs from the packaged app" }
            $marker = Get-Item -LiteralPath (Join-Path $runtime ".ready")
            if ($preparedAt -and $marker.LastWriteTimeUtc -ne $preparedAt) { throw "Standalone app extracted again on its second launch" }
            $preparedAt = $marker.LastWriteTimeUtc
          }

      - name: Verify Windows installer
        working-directory: bokheim
        shell: pwsh
        run: |
          $installer = "release/Bokheim-Windows-x86_64-Setup.exe"
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -eq 0) {
            throw "The Windows installer is missing or empty"
          }
          $signature = [System.IO.File]::ReadAllBytes($installer)[0..1]
          if ($signature[0] -ne 0x4d -or $signature[1] -ne 0x5a) {
            throw "The Windows installer is not a PE executable"
          }

      - name: Record verified Windows artifacts
        working-directory: bokheim
        shell: pwsh
        run: python scripts/ci/release_artifacts.py record windows --directory release --repository "${{ github.repository }}"

      - name: Retain workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: bokheim-desktop-windows-x86-64
          path: bokheim/release/*
          if-no-files-found: error


  publish-draft:
    permissions:
      contents: write
      statuses: read
    name: Publish verified draft artifacts
    needs: [build-windows, windows-checks]
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Require shared tests for the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci/require-shared-tests.py "$SOURCE_REPOSITORY" "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@v8
        with:
          pattern: bokheim-desktop-*
          path: release
          merge-multiple: true
      - name: Upload verified Windows artifacts to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^\"]*\)"/\1/p' apps/desktop-gpui/Cargo.toml | head -n 1)
          python3 scripts/ci/release_artifacts.py upload windows --directory release --repository "${{ github.repository }}" --tag "v$VERSION"
