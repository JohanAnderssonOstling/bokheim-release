name: macOS release
run-name: Release macOS — ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Add the universal macOS download to this version's existing release
        type: boolean
        required: true
        default: false
      source_commit:
        description: Optional application source commit to package
        type: string
        required: false
      build_only:
        description: Compatibility input; release builds do not run tests
        required: true
        type: boolean
        default: false
  push:
    branches:
      - ci/macos-trial
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  statuses: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTC_BOOTSTRAP: "1"
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  BOKHEIM_PACKAGE_SOURCE_ROOT: ${{ github.workspace }}/bokheim
  RELEASE_REPOSITORY: JohanAnderssonOstling/bokheim-release

jobs:
  build:
    name: Build ${{ matrix.arch }} macOS
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: bokheim
    steps:
      - uses: actions/checkout@v6
        with:
          path: bokheim
          ref: ${{ inputs.source_commit || github.sha }}
      - name: Check out packaging tools
        uses: actions/checkout@v6
        with:
          path: release-packager
          ref: ${{ github.sha }}
          sparse-checkout: |
            apps/desktop-gpui/macos/package.py
            scripts/ci/build_cache.py
            scripts/ci/release_config.py
            scripts/ci/release-config.json
      - name: Load release configuration
        shell: python {0}
        env:
          BOKHEIM_UPDATE_PUBLIC_KEY_HEX: ${{ vars.BOKHEIM_UPDATE_PUBLIC_KEY_HEX }}
          BOKHEIM_UPDATE_KEY_ID: ${{ vars.BOKHEIM_UPDATE_KEY_ID }}
          BOKHEIM_UPDATE_ENDPOINT: ${{ vars.BOKHEIM_UPDATE_ENDPOINT }}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          source = Path(os.environ['GITHUB_WORKSPACE']) / 'bokheim'
          subprocess.run([sys.executable, str(source / 'scripts/ci/release_config.py'), '--github-env'], check=True)
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/GPUI-Fork
          ref: ${{ env.GPUI_FORK_REF }}
          path: GPUI-Fork
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlEngine
          ref: ${{ env.HTML_ENGINE_REF }}
          path: HtmlEngine
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlViewCore
          ref: ${{ env.HTML_VIEW_CORE_REF }}
          path: HtmlViewCore
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Rust and Metal
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
          if ! xcrun --sdk macosx --find metal; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bokheim-macos-v1
          shared-key: desktop-macos-${{ matrix.arch }}
          workspaces: bokheim -> target
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Prepare native speech libraries
        shell: python {0}
        run: |
          import os, platform, tarfile, tomllib, urllib.request
          from pathlib import Path
          version = tomllib.loads(Path('vendor/sherpa-onnx-sys/Cargo.toml').read_text())['package']['version']
          if platform.system() == 'Windows':
              suffix, library = 'win-x64-static-MT-Release-lib', 'sherpa-onnx-c-api.lib'
          else:
              arch = 'arm64' if platform.machine() == 'arm64' else 'x64'
              suffix, library = f'osx-{arch}-static-lib', 'libsherpa-onnx-c-api.a'
          stem = f'sherpa-onnx-v{version}-{suffix}'
          destination = Path(os.environ['RUNNER_TEMP']) / 'bokheim-native-speech'
          destination.mkdir(exist_ok=True)
          archive = destination / (stem + '.tar.bz2')
          url = f'https://github.com/k2-fsa/sherpa-onnx/releases/download/v{version}/{archive.name}'
          urllib.request.urlretrieve(url, archive)
          with tarfile.open(archive, 'r:bz2') as source:
              source.extractall(destination, filter='data')
          lib = destination / stem / 'lib'
          assert (lib / library).is_file(), f'Missing speech library: {lib / library}'
          assert (lib / library).stat().st_size > 0
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'SHERPA_ONNX_LIB_DIR={lib}\n')
          print(f'Prepared native speech libraries: {lib}')
      - name: Verify version tag
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish || false }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('apps/desktop-gpui/Cargo.toml', 'rb'))['package']['version']
          if os.environ['PUBLISH_REQUESTED'] == 'true':
              assert os.environ['GITHUB_REF'].startswith('refs/tags/'), 'Select an existing version tag to publish'
              assert os.environ['GITHUB_REPOSITORY'] == os.environ['RELEASE_REPOSITORY'], 'Publish from the bokheim-release repository'
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag differs from app version'
          PY
      - name: Prepare PDFium inputs
        run: python3 shared/pdfium/prepare.py --target "${{ matrix.target }}"
      - name: Resolve release dependencies
        run: cargo generate-lockfile
      - name: Build optimized desktop app
        run: cargo desktop --release --timings --target "${{ matrix.target }}"
      - name: Retain Cargo build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bokheim-macos-${{ matrix.arch }}-build-timings
          path: bokheim/target/cargo-timings/*.html
          if-no-files-found: ignore
      - name: Stage runtime assets
        run: |
          python3 apps/reader/crates/speech/prepare.py --voice all --dest "target/${{ matrix.target }}/release/tts"
          python3 shared/pdfium/prepare.py --target "${{ matrix.target }}" --dest "target/${{ matrix.target }}/release/pdfium" --offline
      - name: Package and verify architecture bundle
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python3 ../release-packager/apps/desktop-gpui/macos/package.py architecture \
            --arch "${{ matrix.arch }}" --output "$RUNNER_TEMP/macos-package"
      - uses: actions/upload-artifact@v4
        with:
          name: bokheim-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos-package/*
          if-no-files-found: error

  universal:
    name: Package universal macOS download
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      statuses: read
    defaults:
      run:
        shell: bash
        working-directory: bokheim
    steps:
      - uses: actions/checkout@v6
        with:
          path: bokheim
          ref: ${{ inputs.source_commit || github.sha }}
      - name: Check out packaging tools
        uses: actions/checkout@v6
        with:
          path: release-packager
          ref: ${{ github.sha }}
          sparse-checkout: apps/desktop-gpui/macos/package.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: bokheim-macos-*
          path: packages
      - name: Combine, sign and verify universal app
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python3 ../release-packager/apps/desktop-gpui/macos/package.py universal \
            --arm64 "$GITHUB_WORKSPACE/packages/bokheim-macos-arm64/Bokheim-macOS-arm64.zip" \
            --x86-64 "$GITHUB_WORKSPACE/packages/bokheim-macos-x86_64/Bokheim-macOS-x86_64.zip" \
            --output "$RUNNER_TEMP/macos-release"
      - uses: actions/upload-artifact@v4
        with:
          name: bokheim-macos-universal
          path: ${{ runner.temp }}/macos-release/*
          if-no-files-found: error
      - name: Upload macOS download to existing release
        if: github.repository == 'JohanAnderssonOstling/bokheim-release' && startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/check-server-protocol.py "$GITHUB_SHA"
          # Existing tags/releases only; never overwrite a published download.
          gh api "repos/$RELEASE_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" >/dev/null
          gh release view "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" \
            "$RUNNER_TEMP/macos-release/Bokheim-macOS-universal.dmg" \
            "$RUNNER_TEMP/macos-release/Bokheim-macOS-universal.dmg.sha256" \
            "$RUNNER_TEMP/macos-release/build-macos.json"
