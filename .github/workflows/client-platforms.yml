name: Windows platform release checks
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'client/**'
      - 'apps/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/ci/**'
      - '.github/workflows/client-platforms.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'apps/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/ci/**'
      - '.github/workflows/client-platforms.yml'
permissions:
  contents: read
concurrency:
  group: windows-platform-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    name: Windows platform checks
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bokheim
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      RUSTC_BOOTSTRAP: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          path: bokheim
      # Match the pinned sibling sources used by desktop-release.yml.
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/GPUI-Fork
          ref: cb2f5b981889d421153d5804526929e32c0788fd
          path: GPUI-Fork
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlEngine
          ref: 91766fb2db8d56b38dc0336ddf74972da9872520
          path: HtmlEngine
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlViewCore
          ref: 0d407738fd6ecfd6d6ea84f1a9ce0a488e3dfaf7
          path: HtmlViewCore
      - name: Install Rust and build dependencies
        run: |
          rustup toolchain install 1.95.0 --profile minimal
      - name: Restore hosted platform build cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bokheim-platform-checks-v1
          key: windows
          workspaces: bokheim -> target
          cache-on-failure: true
          cache-workspace-crates: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare native PDFium
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          python shared/pdfium/prepare.py --target "$target"
      - name: Windows standalone PDF runtime
        run: cargo test --release -p pdf-reader-core --test packaged_runtime
      - name: Native platform tests
        run: cargo test --release -p client-platform-native -p client-platform-desktop --features client-platform-native/websocket
      - name: Windows update storage and recovery
        run: |
          for module in native_files activation supervisor windows_package; do
            cargo test --release -p update-client --features native-state "${module}::"
          done
          cargo test --release -p linux-update-host windows
          cargo run --release -p linux-update-host --example windows_update_trial
