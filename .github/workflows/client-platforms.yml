name: Windows platform release checks
on:
  workflow_dispatch:
    inputs:
      fixture_only:
        description: Rerun the Windows executable update integration fixture after other checks have passed
        type: boolean
        default: false
  workflow_call:
  pull_request:
    paths:
      - 'client/**'
      - 'apps/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/ci/**'
      - '.github/workflows/client-platforms.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'apps/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/ci/**'
      - '.github/workflows/client-platforms.yml'
permissions:
  contents: read
concurrency:
  group: windows-platform-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    name: Windows platform checks
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        working-directory: bokheim
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTC_BOOTSTRAP: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          path: bokheim
      # Match the pinned sibling sources used by desktop-release.yml.
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/GPUI-Fork
          ref: 6b1ef5fab98df3c62babc7c9245ccffde5a493a2
          path: GPUI-Fork
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlEngine
          ref: 90bf31db848ec7ad5c405d37fd6027e532d34403
          path: HtmlEngine
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlViewCore
          ref: 60aa193d0381479e06811378decf7f09f0d93f6e
          path: HtmlViewCore
      - name: Install Rust and build dependencies
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: Restore hosted platform build cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bokheim-platform-checks-v1
          key: windows
          workspaces: bokheim -> target
          cache-on-failure: true
          cache-workspace-crates: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare native PDFium
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          python shared/pdfium/prepare.py --target "$target"
      - name: UI panic lint checks
        if: inputs.fixture_only != true
        run: |
          cargo clippy --release --locked --no-deps --lib -p browser-ui -p reader-ui -p ui-components -p application-shell -p audiobook-player
          cargo clippy --release --locked --no-deps --lib --manifest-path ../HtmlEngine/adapters/Cargo.toml -p html-gpui
      - name: Windows standalone PDF runtime
        if: inputs.fixture_only != true
        run: cargo test --release -p pdf-reader-core --test packaged_runtime
      - name: Optional Google Drive feature checks
        if: inputs.fixture_only != true
        run: |
          python -m unittest discover -s apps/desktop-gpui/scripts/tests -p test_optional_google_drive.py
          cargo test --release -p cloud-storage --lib
          cargo test --release -p cloud-storage --features google-drive --lib
      - name: Native platform tests
        if: inputs.fixture_only != true
        run: cargo test --release -p client-platform-native -p client-platform-desktop --features client-platform-native/websocket
      - name: Windows library paths and discovery
        if: inputs.fixture_only != true
        run: cargo test --release -p library-model -p filesystem-scanner -p audiobook-folder -p library-files --lib
      - name: Native application startup regression tests
        if: inputs.fixture_only != true
        run: cargo test --release -p app --lib api::launch::tests
      - name: Windows update storage and recovery
        env:
          FIXTURE_ONLY: ${{ inputs.fixture_only || false }}
        run: |
          if [[ "$FIXTURE_ONLY" != true ]]; then
            for module in native_files activation supervisor windows_package; do
              cargo test --release -p update-client --features native-state "${module}::"
            done
            cargo test --release -p linux-update-host windows
          fi
          cargo run --release -p linux-update-host --example windows_update_trial
