name: Diagnose cold Linux SDK extraction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0ad90e96f75242255d06ef58cd9041aeded58fa6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check cpio and extract the checksum-pinned RPM
        shell: bash
        run: |
          if ! command -v cpio; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y cpio
          fi
          cpio --version | head -n 1
          python3 - <<'PY_PROBE'
          import hashlib, importlib.util, json, tempfile, urllib.request
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('sdk', 'scripts/linux/toolchain.py')
          sdk = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(sdk)
          item = next(x for x in json.loads(Path('scripts/linux/toolchain.json').read_text())['artifacts'] if x['name'].startswith('libxcb-'))
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              archive = root / item['name']
              urllib.request.urlretrieve(item['url'], archive)
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == item['sha256']
              native = root / 'native'
              native.mkdir()
              sdk.extract_rpm(archive, native)
              assert (native / 'usr/lib64/libxcb-composite.so.0').is_file()
              print('Cold extraction with committed tooling succeeded')
          PY_PROBE
