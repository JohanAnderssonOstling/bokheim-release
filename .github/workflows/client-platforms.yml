name: Diagnose Windows import durability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Probe Windows flush and directory rename
        shell: pwsh
        run: |
          @'
          use std::{env, fs::{self, File, OpenOptions}, io::{self, Write}, path::Path};

          fn rename_probe(source: &Path, destination: &Path, label: &str) -> io::Result<()> {
              match fs::rename(source, destination) {
                  Ok(()) => {
                      println!("{label}: succeeded");
                      fs::rename(destination, source)?;
                  }
                  Err(error) => println!("{label}: {error:?}"),
              }
              Ok(())
          }

          fn main() -> io::Result<()> {
              let root = env::temp_dir().join(format!("bokheim-import-probe-{}", std::process::id()));
              let staging = root.join(".preparing");
              let destination = root.join("retained");
              fs::create_dir_all(&staging)?;
              let mut draft = File::create(staging.join("draft.json"))?;
              draft.write_all(b"manifest")?;
              draft.sync_all()?;
              fs::write(staging.join("book"), b"complete book")?;
              println!("Read-only book sync: {:?}", File::open(staging.join("book"))?.sync_all());
              let book = OpenOptions::new().write(true).open(staging.join("book"))?;
              book.sync_all()?;
              println!("Writable book sync: succeeded");
              rename_probe(&staging, &destination, "Rename with draft and book handles open")?;
              drop(book);
              rename_probe(&staging, &destination, "Rename with only draft handle open")?;
              drop(draft);
              fs::rename(&staging, &destination)?;
              println!("Rename with file handles closed: succeeded");
              fs::remove_dir_all(root)
          }
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\import_probe.rs"
          rustc --edition 2024 "$env:RUNNER_TEMP\import_probe.rs" -o "$env:RUNNER_TEMP\import_probe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\import_probe.exe"
          exit $LASTEXITCODE
