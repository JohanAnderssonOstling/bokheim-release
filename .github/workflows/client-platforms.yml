name: Diagnose Windows provider imports
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Windows platform checks
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        working-directory: bokheim
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTC_BOOTSTRAP: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          path: bokheim
      # Match the pinned sibling sources used by desktop-release.yml.
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/GPUI-Fork
          ref: 6b1ef5fab98df3c62babc7c9245ccffde5a493a2
          path: GPUI-Fork
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlEngine
          ref: 7df6a448ebce52573922bbef02806235db3499f1
          path: HtmlEngine
      - uses: actions/checkout@v6
        with:
          repository: JohanAnderssonOstling/HtmlViewCore
          ref: 60aa193d0381479e06811378decf7f09f0d93f6e
          path: HtmlViewCore
      - name: Install Rust and build dependencies
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: Restore hosted platform build cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bokheim-platform-checks-v1
          key: windows
          workspaces: bokheim -> target
          cache-on-failure: true
          cache-workspace-crates: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare native PDFium
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          python shared/pdfium/prepare.py --target "$target"
      - name: Account and protocol compatibility tests
        if: inputs.fixture_only != true
        run: cargo test --release --locked -p account-client -p account-contract -p protobuf-wire --lib
      - name: Verify retained provider imports
        run: cargo test --release --locked -p library-files --lib asset_store::provider_uploads::tests
