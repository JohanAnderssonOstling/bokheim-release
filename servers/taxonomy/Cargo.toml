[package]
name = "taxonomy-server"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.7"
subject-projection = { path = "../../shared/subject-projection", features = ["authoritative-taxonomy"] }
serde = { version = "1", features = ["derive"] }
taxonomy-contract = { path = "../../shared/taxonomy-contract" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = "0.5"
