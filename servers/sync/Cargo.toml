[package]
name = "sync-server"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"
members = [
    ".",
    "crates/server-account",
    "crates/server-postgres",
    "crates/server-asset-store",
    "crates/server-http",
    "crates/server-wire-http",
]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
private_interfaces = "deny"

[lints]
workspace = true

[dependencies]
axum = "0.7"
axum-server = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
reqwest_13 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
resend-rs = { version = "0.29", default-features = false, features = ["rustls-tls"] }
server-postgres = { path = "crates/server-postgres" }
server-asset-store = { path = "crates/server-asset-store" }
server-http = { path = "crates/server-http" }
server-account = { path = "crates/server-account" }

[dev-dependencies]
sync-common = { path = "../../shared/sync-common" }
account-contract = { path = "../../shared/account-contract" }
wire = { package = "protobuf-wire", path = "../../shared/protobuf-wire" }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "postgres"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
