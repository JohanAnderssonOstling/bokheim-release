[package]
name = "server-postgres"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
audiobook-folder = { path = "../../../../shared/audiobook-folder" }
tracing = "0.1"
server-asset-store = { path = "../server-asset-store" }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "migrate"] }
sync-common = { path = "../../../../shared/sync-common" }
thiserror = "1"
tokio = { version = "1", features = ["io-util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
book-identity = { path = "../../../../shared/book-identity", features = ["native-write"] }
blake3 = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
