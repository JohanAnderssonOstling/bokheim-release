[package]
name = "server-asset-store"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
audiobook-folder = { path = "../../../../shared/audiobook-folder" }
tracing = "0.1"
book-identity = { path = "../../../../shared/book-identity" }
blake3 = "1"
sync-common = { path = "../../../../shared/sync-common" }
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
image = { version = "0.24.9", default-features = false, features = ["jpeg"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
