[package]
name = "metadata-server"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.7"
bzip2 = "0.6"
flate2 = "1"
futures-util = "0.3"
memmap2 = "0.9"
subject-projection = { path = "../../shared/subject-projection", features = ["authoritative-taxonomy"] }
metadata-contract = { path = "../../shared/metadata-contract" }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
rayon = "1"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }
roxmltree = "0.20"
rusqlite = { version = "0.40.0", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization.workspace = true

[dev-dependencies]
csv = "1.3.1"
tempfile = "3"
